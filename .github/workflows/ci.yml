name: CI

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review: marking a draft ready runs CI, so a green PR then auto-merges.
    types: [opened, synchronize, reopened, ready_for_review]

# Least privilege: CI only needs to read the repository contents.
permissions:
  contents: read

# Actions are pinned to release commit SHAs (a tag can be moved to other code);
# Dependabot bumps the SHA together with the version comment.

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Syntax check
        run: |
          node --check MMM-Skyss.js
          node --check node_helper.js

      - name: Run tests
        run: npm test

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm

      # --ignore-scripts: dev tooling needs no lifecycle scripts, and skipping them
      # removes a supply-chain vector when installing devDependencies in CI.
      - name: Install dev dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Lint CSS
        run: npm run lint:css

      - name: Lint Markdown
        run: npm run lint:md

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      # End users get no npm install step, so the module must keep zero runtime
      # dependencies; any runtime dependency with a high/critical advisory fails CI.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      # Dev tooling never reaches a mirror, and upstream fixes can lag (a linter may
      # pin a vulnerable sub-dependency), so advisories here raise a warning instead
      # of blocking every pull request. Dependabot keeps the tooling up to date.
      - name: Audit dev tooling (warning only)
        run: >-
          npm audit --audit-level=high ||
          echo "::warning title=npm audit::High/critical advisories in dev-only tooling (see this step's log)."
